[project]
name = "wildlifecv-backend"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "loguru>=0.7.3",
    "numpy>=2.4.4",
    "patool>=4.0.5",
    "pillow>=12.2.0",
    "puremagic>=2.2.0",
    "pydantic>=2.13.4",
    "timecode>=1.5.1",
    "torchcodec>=0.13.0",
    "ultralytics>=8.4.51",
    "uvicorn>=0.46.0",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes (errors)
    "UP",  # pyupgrade (modernize code for newer Python)
    "B",   # flake8-bugbear (common bugs and security issues)
    "SIM", # flake8-simplify (simplify code)
    "I",   # isort (import sorting),
    "W",
    "C901"
]
ignore = ['E501']

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]
