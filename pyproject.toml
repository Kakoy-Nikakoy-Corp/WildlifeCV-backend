[project]
name = "wildlifecv-backend"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "loguru>=0.7.3",
    "numpy>=2.4.4",
    "pydantic>=2.13.4",
    "timecode>=1.5.1",
